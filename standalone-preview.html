    // --- Sound Effects Synthesizer with Salt Sound ---
    class SoundEffects {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && typeof window !== "undefined") {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
      }
      playTick(pitchMultiplier = 1) {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(440 * pitchMultiplier, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.04);
        } catch(e) {}
      }
      playSuccess() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.12, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.35);
          });
        } catch(e) {}
      }
      playFanfare() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const chords = [
            { freqs: [523.25, 659.25, 783.99], time: 0, dur: 0.18 },
            { freqs: [523.25, 659.25, 783.99], time: 0.2, dur: 0.18 },
            { freqs: [523.25, 659.25, 783.99], time: 0.4, dur: 0.18 },
            { freqs: [659.25, 830.61, 1046.50], time: 0.65, dur: 0.8 },
          ];
          chords.forEach(({ freqs, time, dur }) => {
            freqs.forEach(freq => {
              const osc = this.ctx.createOscillator();
              const gain = this.ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(freq, now + time);
              gain.gain.setValueAtTime(0.15, now + time);
              gain.gain.exponentialRampToValueAtTime(0.001, now + time + dur);
              osc.connect(gain);
              gain.connect(this.ctx.destination);
              osc.start(now + time);
              osc.stop(now + time + dur + 0.05);
            });
          });
        } catch(e) {}
      }
      playSaltSound() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;
          const notes = [
            { freq: 293.66, time: 0, dur: 0.3 },
            { freq: 277.18, time: 0.32, dur: 0.3 },
            { freq: 261.63, time: 0.64, dur: 0.3 },
            { freq: 246.94, time: 0.98, dur: 0.8 }
          ];
          notes.forEach(({ freq, time, dur }, index) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(freq, now + time);
            if (index === 3) {
              osc.frequency.exponentialRampToValueAtTime(220.00, now + time + dur);
            }
            gain.gain.setValueAtTime(0.11, now + time);
            gain.gain.exponentialRampToValueAtTime(0.001, now + time + dur);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + time);
            osc.stop(now + time + dur + 0.05);
          });
        } catch(e) {}
      }
    }

                      className={`px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold ${activeSubTab === 'students' ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-600'}`}
                    >
                      ประวัติผู้ได้รับสิทธิ์ทั้งหมด ({students.length})
                    </button>
                    <button
                      onClick={() => setActiveSubTab('winners')}
                      className={`px-5 py-2.5 rounded-xl text-xs sm:text-sm font-bold ${activeSubTab === 'winners' ? 'bg-white text-stone-900 shadow-sm' : 'text-stone-600'}`}
                    >
                      ทำเนียบผู้ได้รับรางวัล มข. ({winners.length})
                    </button>
                  </div>
                </div>

                {activeSubTab === 'students' ? (
                  <div className="bg-white rounded-3xl border border-stone-200 p-6 sm:p-8">
                    <div className="flex flex-col md:flex-row items-center justify-between gap-4 mb-6">
                      <input
                        type="text"
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="🔍 ค้นหารหัสนักศึกษา เช่น 683380... หรือชื่อ"
                        className="w-full md:w-88 px-4 py-2.5 bg-stone-50 border border-stone-200 rounded-2xl text-xs sm:text-sm font-mono"
                      />
                      <div className="flex gap-1.5 overflow-x-auto no-scrollbar w-full md:w-auto">
                        {['ALL', ...Array.from(new Set(students.map(s => s.faculty)))].map(f => (
                          <button
                            key={f}
                            onClick={() => setSelectedFacultyFilter(f)}
                            className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${selectedFacultyFilter === f ? 'bg-amber-400 font-bold' : 'bg-stone-100 text-stone-600'}`}
                          >
                            {f === 'ALL' ? 'ทุกคณะใน มข.' : f.includes('วิทยาลัยการคอมพิวเตอร์') ? '💻 วิทยาลัยการคอมพิวเตอร์' : f.replace('คณะ', '')}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs sm:text-sm">
                        <thead>
                          <tr className="border-b border-stone-100 text-[11px] text-stone-400 font-bold uppercase">
                            <th className="py-3 px-4">วันที่ / เวลา</th>
                            <th className="py-3 px-4">รหัสนักศึกษา</th>
                            <th className="py-3 px-4">ชื่อ - นามสกุล</th>
                            <th className="py-3 px-4">สังกัด (คณะ / วิทยาลัย)</th>
                            <th className="py-3 px-4 text-center">สิทธิ์สะสม</th>
                            <th className="py-3 px-4">สถานะการตรวจรับรอง</th>
                            <th className="py-3 px-4 text-right">ดำเนินการ</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-stone-100">
                          {filteredStudents.map((s) => (
                            <tr key={s.id} className="hover:bg-amber-50/30">
                              <td className="py-3.5 px-4 text-stone-500 whitespace-nowrap text-xs">{s.lastCheckIn}</td>
                              <td className="py-3.5 px-4 font-mono font-bold text-stone-900">
                                <span className="bg-stone-100 px-2 py-0.5 rounded border border-stone-200">{s.id}</span>
                              </td>
                              <td className="py-3.5 px-4 font-extrabold text-stone-900 whitespace-nowrap">{s.name}</td>
                              <td className="py-3.5 px-4 text-stone-700 font-medium">{s.faculty}</td>
                              <td className="py-3.5 px-4 text-center">
                                <span className="px-3 py-1 rounded-xl bg-amber-100 text-amber-950 font-black text-sm">
                                  {s.tickets} สิทธิ์
                                </span>
                              </td>
                              <td className="py-3.5 px-4 whitespace-nowrap">
                                <span className="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">
                                  ✅ อนุมัติแล้ว (Verified)
                                </span>
                              </td>
                              <td className="py-3.5 px-4 text-right">
                                <button
                                  onClick={() => handleQuickAdd(s.id)}
                                  className="px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-amber-400 text-stone-800 text-xs font-bold"
                                >
                                  +1 สิทธิ์
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                ) : (
                  <div className="bg-white rounded-3xl border border-stone-200 p-6 sm:p-8">
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {winners.map(w => (
                        <div key={w.id} className="p-4 rounded-2xl bg-stone-50 border border-stone-200 space-y-2">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-2">
                              <BrandBadge brand={w.prizeBrand} />
                              <div className="font-bold text-xs text-stone-900">{w.prizeName}</div>
                            </div>
                            <span className="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-bold">{w.status}</span>
                          </div>
                          <div className="text-xs pt-1 border-t border-stone-200">
                            <div className="font-bold text-stone-900">{w.studentName}</div>
                            <div className="text-[11px] text-stone-500 font-mono">รหัส: {w.studentId} • {w.faculty}</div>
                          </div>
                          <div className="text-[10px] text-stone-400">{w.date}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {/* Winner Modal (20% Win) */}
          {recentWinner && recentPrize && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/65 backdrop-blur-xs">
              <div className="w-full max-w-md bg-white rounded-3xl overflow-hidden shadow-2xl border border-stone-200">
                <div className="bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 p-6 text-center text-stone-950">
                  <div className="text-3xl mb-1">🎉</div>
                  <h3 className="text-2xl font-black">ขอแสดงความยินดีด้วย!</h3>
                  <p className="text-xs font-bold text-stone-800">ทะลุเรทเกลือ 80% ได้รางวัลใหญ่สำเร็จ!</p>
                </div>
                <div className="p-6 space-y-4">
                  <div className="flex items-center gap-3 p-3 bg-stone-50 rounded-2xl border border-stone-200">
                    <img src={recentWinner.avatar} alt="" className="w-14 h-14 rounded-xl object-cover border-2 border-amber-400" />
                    <div>
                      <div className="text-xs font-mono font-bold text-amber-800">รหัสนักศึกษา: {recentWinner.id}</div>
                      <div className="text-base font-black text-stone-900">{recentWinner.name}</div>
                      <div className="text-xs font-semibold text-stone-600">{recentWinner.faculty}</div>
                    </div>
                  </div>

                  <div className="p-3 bg-amber-50 rounded-2xl border border-amber-200 flex items-center justify-between">
                    <div className="flex items-center gap-2.5">
                      <BrandBadge brand={recentPrize.brand} />
                      <div>
                        <div className="text-xs font-bold text-stone-500 uppercase">ของรางวัลที่ได้รับ</div>
                        <div className="text-sm font-extrabold text-stone-900">{recentPrize.name}</div>
                        <div className="text-xs text-amber-700 font-semibold">{recentPrize.value.toLocaleString()} {recentPrize.unit} ({recentPrize.brand})</div>
                      </div>
                    </div>
                    <span className="text-[10px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full">ตัดสิทธิ์ 1 สิทธิ์แล้ว</span>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      onClick={() => {
                        const txt = `🎉 ยินดีด้วยกับ ${recentWinner.name} (รหัส ${recentWinner.id}) สังกัด ${recentWinner.faculty} ทะลุเรทเกลือ 80% ได้รับรางวัล ${recentPrize.name} ในโครงการ KKU Helmet Hero!`;
                        if (navigator.clipboard) { navigator.clipboard.writeText(txt); alert("คัดลอกข้อความประกาศผลรางวัลแล้ว!"); }
                      }}
                      className="w-1/2 py-2.5 rounded-xl border border-stone-300 font-bold text-xs cursor-pointer"
                    >
                      📢 แชร์ผลรางวัล
                    </button>
                    <button
                      onClick={() => { setRecentWinner(null); setRecentPrize(null); }}
                      className="w-1/2 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-stone-950 font-bold text-xs cursor-pointer"
                    >
                      เสร็จสิ้น & สุ่มต่อ
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Salt Modal (80% Salt!) */}
          {recentSalt && recentSaltStudent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/70 backdrop-blur-xs">
              <div className="w-full max-w-md bg-white rounded-3xl overflow-hidden shadow-2xl border border-stone-200">
                <div className="bg-gradient-to-r from-stone-700 via-stone-800 to-stone-900 p-6 text-center text-white">
                  <div className="w-14 h-14 rounded-2xl bg-white/10 flex items-center justify-center mx-auto mb-2 text-2xl">🧂</div>
                  <span className="bg-amber-400 text-stone-950 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">เรทเกลือ 80% ทำงาน!</span>
                  <h3 className="text-2xl font-black mt-2">ได้รับความเค็มระดับตำนาน!</h3>
                  <p className="text-xs text-stone-300">ถึงรอบนี้จะเกลือ แต่สวมหมวกนิรภัย ปลอดภัยแน่นอน</p>
                </div>
                <div className="p-6 space-y-4">
                  <div className="p-4 bg-stone-50 rounded-2xl border border-stone-200 space-y-1.5">
                    <span className="text-[10px] font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded">{recentSalt.tag}</span>
                    <div className="font-black text-sm text-stone-900">{recentSalt.name}</div>
                    <p className="text-xs text-stone-600 italic">"{recentSalt.meme}"</p>
                    <div className="text-[11px] font-semibold text-emerald-700 pt-1 border-t">{recentSalt.consolation}</div>
                  </div>

                  <div className="flex items-center justify-between p-3 bg-amber-50 rounded-xl text-xs">
                    <div className="font-bold text-stone-900">{recentSaltStudent.name} ({recentSaltStudent.id})</div>
                    <div className="text-amber-800 font-extrabold">สิทธิ์เหลือ: {students.find(s => s.id === recentSaltStudent.id)?.tickets ?? 0} สิทธิ์</div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      onClick={() => {
                        const txt = `🧂 ได้รับเกลือ! ${recentSaltStudent.name} สุ่มได้ "${recentSalt.name}" ใน KKU Helmet Hero! ขับขี่ปลอดภัย 100% แต่เค็มจัด!`;
                        if (navigator.clipboard) { navigator.clipboard.writeText(txt); alert("คัดลอกมุกเกลือแล้ว!"); }
                      }}
                      className="w-1/2 py-2.5 rounded-xl border border-stone-300 text-stone-700 font-bold text-xs"
                    >
                      📢 แชร์ความเค็ม
                    </button>
                    <button
                      onClick={() => { setRecentSalt(null); setRecentSaltStudent(null); }}
                      className="w-1/2 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-stone-950 font-bold text-xs"
                    >
                      ยอมรับความเค็ม & ลุ้นใหม่
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-auto border-t border-stone-200 bg-white py-8 text-stone-600">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
              <div>🛡️ KKU Helmet Hero: มหาวิทยาลัยขอนแก่น © 2026 • วิทยาลัยการคอมพิวเตอร์</div>
              <button
                onClick={() => {
                  try {
                    localStorage.removeItem('kku_safe_ride_students_v3');
                    localStorage.removeItem('kku_safe_ride_prizes_v3');
                    localStorage.removeItem('kku_safe_ride_winners_v3');
                  } catch(e){}
                  setStudents(INITIAL_STUDENTS);
                  setPrizes(INITIAL_PRIZES);
                  setWinners(INITIAL_WINNERS);
                  setSelectedPrizeId(INITIAL_PRIZES[0].id);
                  showToast("🔄 รีเซ็ตข้อมูลตัวอย่าง มข. เรียบร้อยแล้ว");
                }}
                className="px-3 py-1.5 rounded-xl text-stone-600 hover:text-stone-950 bg-stone-100 border border-stone-200 cursor-pointer"
              >
                🔄 รีเซ็ตข้อมูลตัวอย่างกลับเป็นค่าเริ่มต้น
              </button>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
